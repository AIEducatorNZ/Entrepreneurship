<script>
(()=>{
const root=document.getElementById('entreDeck');

const stages=[
  'Empathise',
  'Define',
  'Ideate',
  'Prototype',
  'Test',
  'Launch & Learn'
];

const S=[

['Opening',
'University of Auckland Entrepreneurs Club',
'From problem to launch',
'AI-powered Design Thinking for entrepreneurs',
'<div class="heroWrap"><img class="slideImage heroAsset" src="images/slide-1.png" alt="Student entrepreneurs collaborating with AI-assisted insight overlays"><div class="qrCard heroQr"><img src="images/qr.png" alt="QR code linking to the online presentation"><div class="qrCopy"><strong>Follow along</strong>Slides + AI prompts</div></div></div>',
'Frame this as a journey, not a list of AI tools. Leave this slide up briefly so the audience can scan the QR code before you begin.',
''],

['Opening','The trap','','','<div class="trapLayout"><div class="trapCopy">The biggest startup risk is often not whether you can <strong>build it</strong>.<br><br>It is whether you <strong>should build it.</strong></div><img class="trapImage" src="images/slide-2.png" alt="Startup team moving quickly along a digital path toward a visible dead end"></div>','AI can accelerate poor thinking as easily as good thinking. Use the image as the visual metaphor: AI lets us move faster, but speed does not guarantee direction.',''],
['Opening',
'Our operating system',
'Design Thinking is the spine.',
'AI is the accelerator. Evidence is the discipline.',
'Empathise → Define → Ideate → Prototype → Test → Launch & Learn',
'Explain where TAM, pricing, competitors and planning fit inside the process.',
''],

['Opening',
'',
'',
'',
'<img class="slideImage" src="images/slide-4.png" alt="Design Thinking double-diamond process showing divergence, convergence and iteration">',
'Use the diagram to explain divergence, convergence and iteration. The image carries the definition, so avoid repeating its labels verbatim.',
''],

['Opening',
'How the prompts work',
'One conversation. One evolving evidence base.',
'The prompts only appear when there is a concrete piece of entrepreneurial work to do.',
'Run the sequence in the same AI chat • Keep a Venture Evidence Brief • Each action prompt inherits the last • Separate evidence from assumptions • Carry unresolved questions forward',
'Explain that the prompts are deliberately chained rather than standalone. Concept slides have speaker notes only; action slides add the next prompt in the workflow.',
''],

['Empathise',
'',
'',
'',
'<img class="slideImage" src="images/slide-6.png" alt="LastBite story from two observations to the common mistake of jumping straight to an app">',
'Walk the audience left to right through the two observations, then pause on the common mistake. Stress that the app is a premature solution hypothesis, not the problem statement or validated opportunity.',
''],

['Empathise',
'1. Empathise',
'Start with people, not ideas.',
'What problem is hiding inside those observations?',
'Behaviours • workarounds • pain points • triggers • trade-offs',
'This is the first action prompt. Initialise the Venture Evidence Brief from the two observations, then use it to plan discovery.',
'We have two starting observations: (1) Auckland university students often describe prepared food as expensive, and (2) cafés may have unsold prepared food near the end of the day. Treat both as hypotheses to investigate, not proven facts. Create a discovery plan that identifies the priority customer and stakeholder groups, the behaviours and existing workarounds we need to understand, the most important unknowns, and the evidence that would make us conclude there is no worthwhile problem here. Do not propose a product yet.'],

['Empathise',
'AI as research assistant',
'Widen the search space.',
'Look for recurring problems before committing to a solution.',
'Explore reviews, discussions, complaints and patterns. Treat the result as hypotheses.',
'Encourage source checking for factual research. This prompt should inherit the customer groups and unknowns identified in the discovery plan.',
'Using the customer groups, behaviours and unknowns already identified in our Venture Evidence Brief, conduct secondary research to widen the search space. Identify recurring frustrations, behaviours, complaints, workarounds and alternatives relevant to those exact groups. For every finding, label whether it is a sourced fact, an inference from sources, or a hypothesis, and state what still needs to be verified with real people.'],

['Empathise',
'',
'',
'',
'<img class="slideImage" src="images/slide-9.png" alt="Assumption map showing what must be true before the LastBite opportunity is validated">',
'Use the map to make the hidden assumptions visible. Emphasise that these are questions to test, not facts to defend.',
'Using the discovery plan and secondary research already captured in the Venture Evidence Brief, identify the assumptions that would have to be true for there to be a worthwhile opportunity connecting students seeking affordable prepared food with cafés that have surplus. Group them into customer, problem, timing, operational, economic, behavioural and market assumptions. Rank them by importance and evidence strength. Do not design the product yet.'],

['Empathise','Customer interviews','Ask about the past, not the imaginary future.','','<div class="interviewCompare"><div class="interviewCards"><div class="interviewCard bad"><div class="interviewLabel">Bad question</div><div class="interviewQuote">“Would you use this?”</div><div class="interviewMeta">Hypothetical • polite intent • easy to overstate</div></div><div class="interviewCard good"><div class="interviewLabel">Better question</div><div class="interviewQuote">“Tell me about the last time this happened.”</div><div class="interviewMeta">Past behaviour • specific context • real trade-offs</div></div></div><div class="interviewRule"><strong>Behaviour</strong> is stronger evidence than intention.</div></div>','Behaviour is stronger evidence than polite intent. Build the interview guide from the highest-risk assumptions in the brief.','Using the highest-priority, lowest-evidence assumptions in our Venture Evidence Brief, create a behaviour-based interview guide for the relevant student and café participants. Focus on real past behaviour, current workarounds, frequency, triggers, costs and trade-offs. For each question, state which assumption it tests and what answer would weaken that assumption.'],
['Empathise',
'After the interviews',
'AI can synthesise. You interpret.',
'',
'Themes • contradictions • workarounds • urgency • willingness to pay • unknowns',
'Mention anonymising sensitive interview data. This prompt assumes the student now pastes in the interview notes generated by real research.',
'Using the assumptions and interview guide already in our Venture Evidence Brief, analyse the anonymised interview notes I provide next. Separate direct evidence, repeated patterns, contradictions, inference and unanswered questions. For each material finding, state which prior assumption it strengthens, weakens or leaves unresolved. Do not invent quotes, counts or conclusions.'],

['Define',
'2. Define',
'What problem are we actually solving?',
'Narrow the customer, context, pain and alternative.',
'The evidence may reveal two linked problems: one for students and one for cafés.',
'Move from divergence to convergence.',
'Using only the evidence accumulated during Empathise, write up to five precise problem statements in the form: [customer] struggles to [job] when [context] because [pain/current alternative]. For each, cite the evidence already in the Venture Evidence Brief, score its evidence strength and commercial relevance, and recommend the best-supported problem to take forward.'],

['Define',
'',
'',
'',
'<img class="slideImage" src="images/slide-13.png" alt="Jobs to Be Done for students and cafés in the LastBite opportunity">',
'Use the two sides to show that customers care about making progress, not about the product itself. Keep the technology secondary to the outcomes.',
'Using the problem statement selected in the previous step and the evidence already in the Venture Evidence Brief, build a Jobs-to-Be-Done analysis for the priority customer. Include functional, emotional and social jobs, triggers, anxieties, current alternatives, desired outcomes and switching barriers. Label anything not supported by evidence as a hypothesis.'],

['Define','Risk first','Find the assumption that can kill the business.','High importance + low evidence = test next.','<div class="riskMatrix"><div class="riskGrid"><div></div><div class="riskAxisTop">Evidence strength</div><div></div><div class="riskAxisSide">Importance</div><div class="riskHead">Low evidence</div><div class="riskHead">High evidence</div><div class="riskHead">High</div><div class="riskCell hot"><strong>TEST FIRST</strong><span>High importance. Weak evidence. This is where learning has the highest value.</span><div class="riskExample">LastBite: Will cafés tolerate the operational effort at closing time?</div></div><div class="riskCell"><strong>Important / better known</strong><span>Keep watching, but evidence already reduces uncertainty.</span></div><div class="riskHead">Low</div><div class="riskCell"><strong>Park for now</strong><span>Do not spend scarce founder attention here yet.</span></div><div class="riskCell"><strong>Monitor</strong><span>Known enough and not currently critical.</span></div></div></div>','Use the matrix to show that startup work should be prioritised by importance and evidence, not by convenience. Pause on the cyan TEST FIRST quadrant and connect it to the LastBite example.','Using the selected problem statement, Jobs-to-Be-Done analysis and all evidence in the Venture Evidence Brief, rescore the remaining assumptions for business importance and evidence strength. Identify the high-importance, low-evidence assumptions and rank the next three learning priorities. Do not design experiments yet.'],
['Define','Market size','TAM / SAM / SOM are models, not magic numbers.','Use AI to build the logic. Verify the inputs.','<div class="marketModel"><div class="marketCompare"><div class="marketCard"><div class="marketLabel">Top-down</div><div class="marketBig">“The food market is worth $X billion...”</div><div class="marketMuted">Impressive-looking numbers can hide weak assumptions. Big market ≠ reachable market.</div></div><div class="marketCard bottom"><div class="marketLabel">Bottom-up</div><div class="marketBig">Build the estimate from behaviour you can explain.</div><div class="marketFormula"><div class="marketTerm">8,000 relevant students</div><div class="marketTimes">×</div><div class="marketTerm">2 purchases / week</div><div class="marketTimes">×</div><div class="marketTerm">$8 transaction</div><div class="marketTimes">×</div><div class="marketTerm">30 weeks</div></div><div class="marketResult">Explainable market estimate — then verify every input.</div></div></div><div class="marketFunnel"><div class="marketStep"><strong>TAM</strong><span>Total theoretical market</span></div><div class="marketStep"><strong>SAM</strong><span>Market this model can serve</span></div><div class="marketStep"><strong>SOM</strong><span>Plausible early capture</span></div></div></div>','Use the contrast to show why bottom-up market sizing is more useful for an early-stage founder. The sample numbers are illustrative, not claims about LastBite. Emphasise: build the logic, then verify the inputs.','Using the customer definition, geography, behaviours and problem scope already established in our Venture Evidence Brief, build a bottom-up TAM/SAM/SOM model. Reuse observed inputs where available, identify external data still required, show every formula, create conservative/base/optimistic cases, and then critique the model as a skeptical investor.'],
['Ideate',
'3. Ideate',
'Generate solutions, not just “an app.”',
'Diverge before you converge.',
'Marketplace • café SaaS • membership • university partnership • low-tech service',
'Show how cheap exploration has become. This is where LastBite becomes one possible solution among several.',
'Using the selected problem, Jobs-to-Be-Done analysis, market constraints and highest-risk assumptions in our Venture Evidence Brief, generate 20 materially different ways to solve the problem. Include software, service, marketplace, partnership and low-tech approaches. For each, identify who pays, which job it addresses, what existing evidence supports it and the biggest new assumption it introduces. Do not privilege the original app idea.'],

['Ideate',
'Competitors',
'“We have no competitors” is almost always wrong.',
'',
'Direct • indirect • substitutes • do nothing',
'Competitor research should answer why you should exist.',
'Using the customer job and strongest solution territories already in our Venture Evidence Brief, map direct competitors, indirect competitors, substitutes and do-nothing behaviour. Compare target customer, proposition, pricing, business model, distribution, strengths, weaknesses and complaints. Then reassess which of our solution territories still look differentiated.'],

['Prototype',
'',
'',
'',

let i=0;

const screen=root.querySelector('#screen'),
bar=root.querySelector('#bar'),
st=root.querySelector('#st'),
stageBanner=root.querySelector('#stageBanner'),
count=root.querySelector('#count'),
spine=root.querySelector('#spine'),
notes=root.querySelector('#notes'),
notesTitle=root.querySelector('#notesTitle'),
note=root.querySelector('#note'),
prompt=root.querySelector('#prompt'),
promptHint=root.querySelector('#promptHint'),
nb=root.querySelector('#notesBtn');

function stageIdx(x){
  return stages.indexOf(x)
}

function stageLabel(x){
  const si=stageIdx(x);
  return si>=0
    ?`Design Thinking · Stage ${si+1} of ${stages.length} · ${x}`
    :'Design Thinking Journey'
}

function priorActionCount(idx){
  let c=0;

  for(let j=0;j<idx;j++){
    if(S[j][6]&&S[j][6].trim())c++
  }

  return c
}

function chainPrompt(stage,p,idx){
  if(!p||!p.trim())return '';

  const first=priorActionCount(idx)===0;

  const start=first
    ?`START THE VENTURE EVIDENCE BRIEF

We are beginning one continuous entrepreneurial workflow. Create and maintain a Venture Evidence Brief with:
1. Venture / opportunity
2. Target customers and stakeholders
3. Observed evidence
4. Problem / jobs to be done
5. Assumptions and confidence
6. Market sizing inputs and sources
7. Competitors / substitutes
8. Solution hypotheses
9. Prototype / experiment results
10. Pricing and business model
11. Unit economics
12. Go-to-market evidence
13. Risks / unanswered questions
14. Decisions and changes

Rules: distinguish evidence from inference and speculation; never treat AI output as customer validation; never silently overwrite earlier findings; flag contradictions; and preserve useful outputs for the next action prompt.`
    :`CONTINUE THE EXISTING VENTURE EVIDENCE BRIEF

Start from the evidence, assumptions, decisions and unresolved questions produced by the previous ACTION prompt. Do not restart the analysis, repeat work unnecessarily or invent missing evidence. If this task changes an earlier conclusion, explain why.`;

  const end=`

AFTER THIS ACTION
Update the Venture Evidence Brief with only what this step adds or changes. Finish with a short CHANGE LOG:
• What we learned
• What changed
• What remains uncertain
• What the next action prompt should inherit`;

  return `${start}

CURRENT DESIGN THINKING STAGE: ${stage}

ACTION
${p}${end}`
}

function drawSpine(){
  const si=stageIdx(S[i][0]);

  spine.innerHTML=stages.map((x,j)=>
    `<div class="chip ${j===si?'on':''}">${j+1}. ${x}</div>`
  ).join('')
}

function draw(){
  const s=S[i];
  const [stage,eye,title,sub,body,n,p]=s;

  let content=`<div class="eye">${eye}</div>`;

  if(title){
    content+=`<h1>${title}</h1>`
  }

  if(sub){
    content+=`<div class="sub">${sub}</div>`
  }

  if(body){
    if(body.includes('•')){
      content+=`<div class="grid">${
        body.split('•').map(x=>
          `<div class="card"><span>${x.trim()}</span></div>`
        ).join('')
      }</div>`
    } else {
      content+=`<div class="story">${body}</div>`
    }
  }

  screen.innerHTML=content;

  bar.style.width=((i+1)/S.length*100)+'%';

  st.textContent=
    stageIdx(stage)>=0
      ?`Stage ${stageIdx(stage)+1}: ${stage}`
      :'Design Thinking';

  stageBanner.textContent=stageLabel(stage);

  count.textContent=`${i+1} / ${S.length}`;

  note.textContent=n;

  const cp=chainPrompt(stage,p,i);
  const hasPrompt=!!cp;

  prompt.style.display=hasPrompt?'block':'none';
  promptHint.style.display=hasPrompt?'block':'none';
  prompt.textContent=cp;

  promptHint.textContent=
    hasPrompt
      ?'Action prompt: run this in the same AI conversation as the previous action prompt. Each action reads and updates the Venture Evidence Brief.'
      :'';

  notesTitle.textContent=
    hasPrompt
      ?'Speaker notes + action prompt'
      :'Speaker notes';

  nb.textContent=
    notes.classList.contains('open')
      ?'Hide Notes'
      :(hasPrompt?'Notes / Prompt':'Notes');

  drawSpine();

  root.querySelector('#prev').disabled=i===0;

  root.querySelector('#next').textContent=
    i===S.length-1?'Restart':'Next'
}

function move(d){
  if(d>0&&i===S.length-1){
    i=0
  } else {
    i=Math.max(0,Math.min(S.length-1,i+d))
  }

  draw()
}

root.querySelector('#prev')
  .addEventListener('click',()=>move(-1));

root.querySelector('#next')
  .addEventListener('click',()=>move(1));

nb.addEventListener('click',()=>{
  const o=notes.classList.toggle('open');

  const hasPrompt=
    !!chainPrompt(S[i][0],S[i][6],i);

  nb.textContent=
    o
      ?'Hide Notes'
      :(hasPrompt?'Notes / Prompt':'Notes')
});

root.querySelector('#overview')
  .addEventListener('click',()=>{

    screen.innerHTML=
      `<div class="eye">Deck overview</div>
       <h2>Design Thinking journey</h2>
       <div class="grid">${
         stages.map((x,j)=>
           `<button
             class="card"
             data-go="${x}"
             type="button"
             style="color:white;text-align:left;cursor:pointer">
              <b>Stage ${j+1}: ${x}</b>
              <span>${S.filter(s=>s[0]===x).length} slides</span>
            </button>`
         ).join('')
       }</div>`;

    screen.querySelectorAll('[data-go]').forEach(b=>
      b.addEventListener('click',()=>{
        const k=S.findIndex(s=>s[0]===b.dataset.go);

        if(k>=0){
          i=k;
          draw()
        }
      })
    );

    st.textContent='Overview';
    stageBanner.textContent='Design Thinking Journey · Overview'
});

root.addEventListener('keydown',e=>{

  if(e.key==='ArrowRight'||e.key==='PageDown'){
    e.preventDefault();
    move(1)
  }

  if(e.key==='ArrowLeft'||e.key==='PageUp'){
    e.preventDefault();
    move(-1)
  }

  if(e.key==='s'||e.key==='S'){
    e.preventDefault();
    nb.click()
  }

});

draw();

})();
</script>

<script>
(()=>{
  const banner=document.getElementById('stageBanner');
  const promptEl=document.getElementById('prompt');

  if(!banner||!promptEl)return;

  function updatePromptBadge(){
    const hasPrompt=
      promptEl.style.display!=='none' &&
      promptEl.textContent.trim().length>0;

    let badge=document.getElementById('promptBadge');

    if(hasPrompt&&!badge){
      badge=document.createElement('span');
      badge.id='promptBadge';
      badge.className='promptBadge';
      badge.textContent='>_ PROMPT';
      badge.setAttribute(
        'aria-label',
        'Action prompt available on this slide'
      );
      badge.title='Action prompt available';
      banner.appendChild(badge)
    }
    else if(!hasPrompt&&badge){
      badge.remove()
    }
  }

  const observer=new MutationObserver(updatePromptBadge);

  observer.observe(promptEl,{
    attributes:true,
    attributeFilter:['style'],
    childList:true,
    characterData:true,
    subtree:true
  });

  updatePromptBadge()
})();
</script>

</div>
